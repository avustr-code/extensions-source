# Sync upstream (keiyoushi) changes into this fork (avustr-code) daily.
# Source: https://github.com/keiyoushi/extensions-source (fetch only, NEVER pushed to)
# Target: https://github.com/avustr-code/extensions-source (this repo's main, auto-pushed)
# Conflict rule: if upstream changed a file that this fork also changed, that file is skipped
# (our version kept); all other upstream file changes are applied. A report issue is opened.
name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch: # Manual trigger from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: "github.repository == 'avustr-code/extensions-source'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/keiyoushi/extensions-source.git"

      - name: Fetch upstream and origin
        run: |
          git fetch --quiet upstream main
          git fetch --quiet origin main

      - name: Apply non-conflicting upstream changes
        id: sync
        run: |
          set -euo pipefail

          # Reference point: the upstream commit this fork was last synced to, recorded in
          # .github/sync-base-sha. merge-base cannot be used here: this fork never merges
          # upstream, so merge-base stays pinned to the fork point and every file a previous
          # sync copied from upstream would look like a local edit, blocking all later syncs.
          if [ -f .github/sync-base-sha ] && git cat-file -e "$(cat .github/sync-base-sha)^{commit}" 2>/dev/null; then
            BASE=$(cat .github/sync-base-sha)
          else
            BASE=$(git merge-base origin/main upstream/main)
            echo "No usable sync-base-sha, falling back to merge-base."
          fi
          echo "Common base: $BASE"

          # Files this fork changed since the common base.
          git diff --name-only "$BASE" origin/main > /tmp/ours.txt

          # Upstream changes since the common base (name-status: A/M/D/R...).
          git diff --name-status "$BASE" upstream/main > /tmp/theirs.txt

          conflicts=()
          applied=0

          # Extensions kept in sync with upstream verbatim: always take upstream's version,
          # even if this fork previously touched the same path.
          forced_sync_prefixes=("src/ko/goodtoon/" "src/ko/newxtoon/")

          while read -r status path extra; do
            [ -z "$path" ] && continue

            # Never let upstream CI/config files override this fork's pipeline.
            case "$path" in
              .github/*) continue ;;
            esac

            # For renames (R-nn), the new path is field 3 and the old path (field 2) is gone upstream.
            old_path=""
            new_path="$path"
            case "$status" in
              R*) old_path="$path"; new_path="$extra" ;;
            esac

            forced=0
            for prefix in "${forced_sync_prefixes[@]}"; do
              case "$new_path" in
                "$prefix"*) forced=1 ;;
              esac
            done

            # Skip if this fork also touched the same path (conflict -> keep ours).
            if [ "$forced" -eq 0 ] && { grep -qx "$new_path" /tmp/ours.txt || { [ -n "$old_path" ] && grep -qx "$old_path" /tmp/ours.txt; }; }; then
              conflicts+=("$new_path")
              continue
            fi

            if [ "$status" = "D" ]; then
              git rm --ignore-unmatch -- "$new_path" || true
            else
              git checkout "upstream/main" -- "$new_path"
              if [ -n "$old_path" ] && [ "$old_path" != "$new_path" ]; then
                git rm --ignore-unmatch -- "$old_path" || true
              fi
            fi
            applied=$((applied + 1))
          done < /tmp/theirs.txt

          {
            echo "applied=$applied"
            echo "skipped=${#conflicts[@]}"
            echo "conflicts<<EOF"
            printf '%s\n' "${conflicts[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "Nothing to sync."
          fi

      - name: Commit and push to avustr-code
        if: ${{ steps.sync.outputs.applied != '0' && steps.sync.outputs.applied != '' }}
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/avustr-code/extensions-source.git"
          git commit -m "chore: sync upstream changes ($(date -u +%Y-%m-%d))"
          git push origin main

      - name: Record upstream commit as the new sync reference
        if: always()
        run: |
          git fetch --quiet upstream main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git show-ref --verify --quiet refs/remotes/origin/main || git update-ref refs/remotes/origin/main origin/main
          NEW_BASE=$(git rev-parse upstream/main)
          if [ "$(git show origin/main:.github/sync-base-sha 2>/dev/null || true)" = "$NEW_BASE" ]; then
            echo "sync-base-sha already current."
            exit 0
          fi
          git checkout origin/main -- .github/sync-base-sha 2>/dev/null || true
          printf '%s\n' "$NEW_BASE" > .github/sync-base-sha
          git add .github/sync-base-sha
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "ci: record upstream sync reference" || exit 0
          git push origin HEAD:main

      - name: Open report issue on conflicts
        if: ${{ steps.sync.outputs.skipped != '0' && steps.sync.outputs.skipped != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The following files were changed by upstream (keiyoushi) but also by this fork, \
          so they were SKIPPED to preserve your changes:

          ${{ steps.sync.outputs.conflicts }}

          All other upstream changes were applied and pushed. Review the skipped files manually if needed."
          gh issue create \
            --title "Upstream sync: ${{ steps.sync.outputs.skipped }} file(s) skipped due to conflict" \
            --body "$body" \
            --label "upstream-sync"
