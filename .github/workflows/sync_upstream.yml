# Sync upstream (keiyoushi) changes into this fork (avustr-code) daily.
# Source: https://github.com/keiyoushi/extensions-source (fetch only, NEVER pushed to)
# Target: https://github.com/avustr-code/extensions-source (this repo's main, auto-pushed)
# Conflict rule: if upstream changed a file that this fork also changed, that file is skipped
# (our version kept); all other upstream file changes are applied. A report issue is opened.
name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch: # Manual trigger from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: "github.repository == 'avustr-code/extensions-source'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/keiyoushi/extensions-source.git"

      - name: Fetch upstream and origin
        run: |
          git fetch --quiet upstream main
          git fetch --quiet origin main

      - name: Apply non-conflicting upstream changes
        id: sync
        run: |
          set -euo pipefail

          # Reference point: the upstream commit this fork was last synced to, recorded in
          # .github/sync-base-sha. merge-base cannot be used here: this fork never merges
          # upstream, so merge-base stays pinned to the fork point and every file a previous
          # sync copied from upstream would look like a local edit, blocking all later syncs.
          if [ -f .github/sync-base-sha ] && git cat-file -e "$(cat .github/sync-base-sha)^{commit}" 2>/dev/null; then
            BASE=$(cat .github/sync-base-sha)
          else
            BASE=$(git merge-base origin/main upstream/main)
            echo "No usable sync-base-sha, falling back to merge-base."
          fi
          echo "Common base: $BASE"

          # Files this fork changed since the common base.
          git diff --name-only "$BASE" origin/main > /tmp/ours.txt

          # Upstream changes since the common base (name-status: A/M/D/R...).
          git diff --name-status "$BASE" upstream/main > /tmp/theirs.txt

          conflicts=()
          applied=0

          # Extensions kept in sync with upstream verbatim: always take upstream's version,
          # even if this fork previously touched the same path.
          forced_sync_prefixes=("src/ko/goodtoon/" "src/ko/newxtoon/")

          # Fork-protected paths: NEVER take from upstream, always keep our version.
          # These are critical for fork-specific build/publish configuration.
          fork_protected_paths=(
            ".github/workflows/build_publish.yml"
            ".github/scripts/generate-build-matrices.py"
            "src/th/blackmanga/"
            "src/th/pedmanga/"
            "src/en/comick/"
            "src/en/novatoon/"
            "src/ko/jjaptoon/"
          )

          while read -r status path extra; do
            [ -z "$path" ] && continue

            # Never let upstream CI/config files override this fork's pipeline.
            case "$path" in
              .github/*) continue ;;
            esac

            # For renames (R-nn), the new path is field 3 and the old path (field 2) is gone upstream.
            old_path=""
            new_path="$path"
            case "$status" in
              R*) old_path="$path"; new_path="$extra" ;;
            esac

            forced=0
            for prefix in "${forced_sync_prefixes[@]}"; do
              case "$new_path" in
                "$prefix"*) forced=1 ;;
              esac
            done

            # Fork-protected: never let upstream override these paths
            if [ "$forced" -eq 0 ]; then
              for protected in "${fork_protected_paths[@]}"; do
                case "$new_path" in
                  "$protected"|"$protected"*)
                    conflicts+=("$new_path [protected]")
                    continue 2
                    ;;
                esac
              done
            fi

            # Skip if this fork also touched the same path (conflict -> keep ours).
            if [ "$forced" -eq 0 ] && { grep -qx "$new_path" /tmp/ours.txt || { [ -n "$old_path" ] && grep -qx "$old_path" /tmp/ours.txt; }; }; then
              conflicts+=("$new_path")
              continue
            fi

            if [ "$status" = "D" ]; then
              git rm --ignore-unmatch -- "$new_path" || true
            else
              git checkout "upstream/main" -- "$new_path"
              if [ -n "$old_path" ] && [ "$old_path" != "$new_path" ]; then
                git rm --ignore-unmatch -- "$old_path" || true
              fi
            fi
            applied=$((applied + 1))
          done < /tmp/theirs.txt

          {
            echo "applied=$applied"
            echo "skipped=${#conflicts[@]}"
            echo "conflicts<<EOF"
            printf '%s\n' "${conflicts[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "Nothing to sync."
          fi

      - name: Commit and push to avustr-code
        if: ${{ steps.sync.outputs.applied != '0' && steps.sync.outputs.applied != '' }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/avustr-code/extensions-source.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BASE=$(cat .github/sync-base-sha 2>/dev/null || echo "")

          # Collect all staged files from the sync step
          mapfile -t STAGED_FILES < <(git diff --cached --name-only | grep -v '^$' || true)

          if [ ${#STAGED_FILES[@]} -eq 0 ]; then
            echo "Nothing staged to commit."
            exit 0
          fi

          # Group files by module/multisrc/lib/src
          declare -A GROUP_FILES
          declare -A GROUP_KEY

          for f in "${STAGED_FILES[@]}"; do
            key=""
            case "$f" in
              lib-multisrc/*/*)
                # lib-multisrc/<name>/...
                name=$(echo "$f" | cut -d/ -f2)
                key="multisrc:$name"
                ;;
              src/*/*/*)
                # src/<lang>/<extension>/...
                lang=$(echo "$f" | cut -d/ -f2)
                ext=$(echo "$f" | cut -d/ -f3)
                key="src:$lang:$ext"
                ;;
              lib/*/*)
                # lib/<name>/...
                name=$(echo "$f" | cut -d/ -f2)
                key="lib:$name"
                ;;
              core/*)
                key="core"
                ;;
              common/*)
                key="common"
                ;;
              compiler/*)
                key="compiler"
                ;;
              gradle/*|build.gradle.kts|gradle.properties|settings.gradle.kts|gradlew*|*.gradle*)
                key="build"
                ;;
              .github/*)
                # Should be skipped by protection, but just in case group separately
                key="ci"
                ;;
              *)
                key="other"
                ;;
            esac
            GROUP_FILES["$key"]+="$f"$'\n'
            GROUP_KEY["$key"]=1
          done

          # Commit each group separately (deterministic order)
          for key in $(printf '%s\n' "${!GROUP_KEY[@]}" | sort); do
            files_str="${GROUP_FILES[$key]}"
            # Skip empty
            [ -z "$(echo "$files_str" | grep -v '^$' || true)" ] && continue

            # Build array
            mapfile -t gfiles < <(echo "$files_str" | grep -v '^$')

            # Unstage everything, then stage only this group
            git reset -q HEAD -- . 2>/dev/null || true

            for gf in "${gfiles[@]}"; do
              git add -- "$gf" 2>/dev/null || true
            done

            # Skip if nothing staged for this group
            if git diff --cached --quiet; then
              continue
            fi

            # Determine commit message
            cmsg=""
            case "$key" in
              multisrc:*)
                name=$(echo "$key" | cut -d: -f2)
                # Try to get upstream commit message for these files
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                if [ -n "$upstream_msg" ]; then
                  # Use upstream message as-is if it already mentions the module, else prefix
                  if echo "$upstream_msg" | grep -qi "^$name:"; then
                    cmsg="$upstream_msg"
                  else
                    cmsg="$name: $upstream_msg"
                  fi
                else
                  cmsg="$name: sync upstream changes"
                fi
                ;;
              src:*)
                lang=$(echo "$key" | cut -d: -f2)
                ext=$(echo "$key" | cut -d: -f3)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                if [ -n "$upstream_msg" ]; then
                  if echo "$upstream_msg" | grep -qi "^$ext:"; then
                    cmsg="$upstream_msg"
                  else
                    cmsg="$ext: $upstream_msg"
                  fi
                else
                  cmsg="$ext: sync upstream changes"
                fi
                ;;
              lib:*)
                name=$(echo "$key" | cut -d: -f2)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                if [ -n "$upstream_msg" ]; then
                  if echo "$upstream_msg" | grep -qi "^$name:"; then
                    cmsg="$upstream_msg"
                  else
                    cmsg="$name: $upstream_msg"
                  fi
                else
                  cmsg="$name: sync upstream changes"
                fi
                ;;
              core)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                cmsg="${upstream_msg:-core: sync upstream changes}"
                ;;
              common)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                cmsg="${upstream_msg:-common: sync upstream changes}"
                ;;
              compiler)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                cmsg="${upstream_msg:-compiler: sync upstream changes}"
                ;;
              build)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                cmsg="${upstream_msg:-build: sync upstream changes}"
                ;;
              ci)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                cmsg="${upstream_msg:-ci: sync upstream changes}"
                ;;
              other)
                upstream_msg=$(git log -1 --format='%s' upstream/main -- "${gfiles[@]}" 2>/dev/null | head -1 || true)
                cmsg="${upstream_msg:-chore: sync upstream changes}"
                ;;
            esac

            git commit -m "$cmsg" || true
          done

          git push origin main

      - name: Record upstream commit as the new sync reference
        if: always()
        run: |
          git fetch --quiet upstream main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/avustr-code/extensions-source.git"
          git show-ref --verify --quiet refs/remotes/origin/main || git update-ref refs/remotes/origin/main origin/main
          NEW_BASE=$(git rev-parse upstream/main)
          if [ "$(git show origin/main:.github/sync-base-sha 2>/dev/null || true)" = "$NEW_BASE" ]; then
            echo "sync-base-sha already current."
            exit 0
          fi
          git checkout origin/main -- .github/sync-base-sha 2>/dev/null || true
          printf '%s\n' "$NEW_BASE" > .github/sync-base-sha
          git add .github/sync-base-sha
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "ci: record upstream sync reference" || exit 0
          git push origin HEAD:main || exit 0

      - name: Open report issue on conflicts
        if: ${{ steps.sync.outputs.skipped != '0' && steps.sync.outputs.skipped != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The following files were changed by upstream (keiyoushi) but also by this fork, \
          so they were SKIPPED to preserve your changes:

          ${{ steps.sync.outputs.conflicts }}

          All other upstream changes were applied and pushed. Review the skipped files manually if needed."
          gh issue create \
            --title "Upstream sync: ${{ steps.sync.outputs.skipped }} file(s) skipped due to conflict" \
            --body "$body" \
            --label "upstream-sync" || true
