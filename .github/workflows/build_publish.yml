  build:
    name: Populate Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Build and lint shared modules
        run: |
          MODULES=(":core")
          for dir in lib lib-multisrc; do
            for build_file in "$dir"/*/build.gradle.kts; do
              MODULES+=(":${dir}:$(basename "$(dirname "$build_file")")")
            done
          done

          # One extension, so that what only extension builds need is cached too
          extension=$(find src -mindepth 2 -maxdepth 2 -type d | sort | head -n 1)
          MODULES+=(":${extension//\//:}")

          TASKS=()
          for module in "${MODULES[@]}"; do
            TASKS+=("${module}:assembleRelease" "${module}:lintRelease")
          done
          ./gradlew "${TASKS[@]}"

  build-extensions:
