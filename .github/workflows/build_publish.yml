name: Fork CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_publish.yml'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild and republish every extension instead of only what changed since the last successful run
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 80
  IS_PR_CHECK: false
  # Fork-only modules that may be built/released. Anything else (upstream
  # drift, other people's sources) is excluded from rebuilds and dropped from
  # the delivery index.
  ALLOWED_MODULES: "all/manhuarm en/comick en/novatoon th/blackmanga th/pedmanga ko/jjaptoon ru/remanga"

